[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bareloop"
version = "0.1.0"
description = "A transparent, OpenAI-compatible agent harness built from first principles."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "BareLoop Contributors" },
]
keywords = ["agent", "ai", "harness", "llm", "openai-compatible"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.12.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "mcp[cli]>=2,<3",
    "openai>=3.3.1",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tokenizer>=3.6.4",
    "transformers>=5.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bareloop"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
